# Словарь атрибуции источников. Владелец — тех-лид, контракт §4.
# Ключ — канонический speaker_org. Матчинг: точное вхождение любого alias в поле `channel`
# frontmatter (регистронезависимо). Ни одной эвристики по похожести строк.
#
# stance:
#   нейтральный          — медиа, подкаст, отраслевой институт, вендор про себя
#   организатор-провайдер — продаёт участие в выставках (заинтересованная сторона)
#   подрядчик            — продаёт услуги вокруг выставок (агентство, сорсинг-агент)
#
# Источник, канал которого не найден здесь: speaker_org = null, stance = нейтральный,
# строка в отчёте `ev ingest --report`. Догадки запрещены.

RusGlobalExport:
  aliases: ["RusGlobalExport", "РусГлобалЭкспорт", "Русглобалэкспорт"]
  stance: "организатор-провайдер"
  # Пять материалов корпуса, а не четыре, как считалось при обследовании: четыре собственных
  # ролика плюс совместный подкаст со Stan&Tan Talks. Плюс страница Компании/RusGlobalExport.
  # Это ключ схлопывания подтверждений: в хабах они цитируются в ряд и внешне выглядят как
  # независимые подтверждения.

"Sales Gravy":
  aliases: ["Sales Gravy"]
  stance: "нейтральный"

"Open to Export":
  aliases: ["Open to Export", "Institute of Export"]
  stance: "нейтральный"
  # Отраслевой институт содействия экспорту. Цифры по SIAL и UBM в этом источнике —
  # статистика самих организаторов, см. reliability_note заметки.

iGlobal:
  aliases: ["iGlobal"]
  stance: "нейтральный"

"Event Rocks":
  aliases: ["Event Rocks", "Event-Терапия", "Событийная терапия"]
  stance: "подрядчик"
  # Агентство выставочного маркетинга — продаёт услуги подготовки к участию.

"uCloudlink":
  aliases: ["uCloudlink", "GlocalMe"]
  stance: "нейтральный"
  # Официальный launch-event вендора: материал компании о собственном продукте.
  # Для вопросов о работе на стенде это наблюдение, а не рекомендация продавца участия.

"01net":
  aliases: ["01net", "Zéro 1", "Zero 1"]
  stance: "нейтральный"

"Stan&Tan Talks":
  aliases: ["Stan&Tan Talks", "Stan&Tan"]
  stance: "нейтральный"
  # Выпуск записан совместно с RusGlobalExport. Матчинг alias RusGlobalExport срабатывает
  # раньше и назначает источнику организатор-провайдер — это намеренно: в выпуске говорит
  # представитель организатора участия.

# Не покрыты намеренно (в frontmatter `channel: не указан`) — остаются с speaker_org: null:
#   - Global Sources April 2024 Sourcing Walkthrough (ведущий — сорсинг-агент, имя не названо)
#   - Работа на выставке — приглашение клиентов и продавливание заказов (вебинар без атрибуции)
# Заполнять их догадкой нельзя: неверная атрибуция ломает схлопывание подтверждений сильнее,
# чем её отсутствие.

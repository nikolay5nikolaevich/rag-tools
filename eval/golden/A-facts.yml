# Категория A — фактические вопросы с одним источником.
# Проверяют retrieval и точность переноса цифр. Каждый факт сверен по файлу корпуса.
# Разметка: тех-лид, T-03. Исполнители тикетов её не правят.

- id: A-01
  category: A
  question: "Сколько касаний и какая пауза в базовом правиле follow-up после события?"
  answerable: true
  expected_source_ids:
    - istochniki-video--trade-show-and-conference-lead-follow-up-secrets-featuring-h
  must_contain: ["8", "12 недел"]
  must_not_contain: []
  expected_limitations: ["reliability_note"]
  notes: >
    Harriet Mellor, Sales Gravy. Дословно: «8 касаний, затем пауза 12 недель, затем заход
    снова». Источник помечен как подкаст про B2B-продажи в целом, цифры — иллюстративные
    оценки спикера; оговорка обязана появиться в ответе.
  holdout: false


- id: A-02
  category: A
  question: "Через какой срок закрылась сделка, начатая на конференции по кибербезопасности?"
  answerable: true
  expected_source_ids:
    - istochniki-video--trade-show-and-conference-lead-follow-up-secrets-featuring-h
  must_contain: ["20 месяц"]
  must_not_contain: []
  expected_limitations: ["reliability_note"]
  notes: >
    CyberCon, ~20 месяцев. Кейс также пересказан в хабе «Кейсы и ошибки» — там прямо сказано,
    что он не доказывает средний цикл выставочного лида. Хороший ответ это удерживает.
  holdout: false


- id: A-03
  category: A
  question: "Какая стоимость участия названа спикером и какая сделка её оправдывает?"
  answerable: true
  expected_source_ids:
    - istochniki-video--trade-show-and-conference-lead-follow-up-secrets-featuring-h
  must_contain: ["50", "100", "500"]
  must_not_contain: []
  expected_limitations: ["reliability_note"]
  notes: >
    Стенд + перелёты + люди ≈ $50–100k; одна сделка ~$500k оправдывает участие.
    Ключевая проверка: система обязана назвать это иллюстративной оценкой спикера,
    а не нормативом. Ответ, подающий цифры как отраслевую норму, — существенная ошибка.
  holdout: false


- id: A-04
  category: A
  question: "За какой срок рекомендуется обработать контакты после возвращения с выставки?"
  answerable: true
  expected_source_ids:
    - istochniki-video--podgotovka-k-organic-natural-v-dubae-vebinar-rusglobalekspor
  must_contain: ["1", "3", "дн"]
  must_not_contain: []
  expected_limitations: ["single_org", "provider_stance"]

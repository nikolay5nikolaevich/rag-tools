    «Обработать 100% контактов через 1–3 дня после возвращения». Источник —
    РусГлобалЭкспорт, организатор коллективного участия. Обе пометки об ограничениях
    обязаны сработать: подтверждение одно и оно от заинтересованной стороны.
  holdout: false


- id: A-05
  category: A
  question: "Сколько визиток рекомендуется брать на сотрудника и сколько всего раздаточных материалов?"
  answerable: true
  expected_source_ids:
    - istochniki-video--podgotovka-k-organic-natural-v-dubae-vebinar-rusglobalekspor
    - istochniki-video--mezhdunarodnye-vystavki-kak-prodavat-po-vsemu-miru
  must_contain: ["150", "200", "300"]
  must_not_contain: []
  expected_limitations: []
  notes: >
    150–200 визиток на сотрудника, всего около 300 единиц материалов.
    ВНИМАНИЕ: в заготовке спеки (раздел 8, вопрос 5) был вопрос про «200 визиток без
    обработки» в Event-Терапии — такого факта в корпусе НЕТ, число 200 относится к раздатке.
    Вопрос заменён на проверяемый. Это же ловушка на выдумывание: система не должна
    склеивать «200 визиток» с сюжетом про необработанные контакты.
  holdout: false



# Категория B — синтез по нескольким источникам.
# Проверяют, вытягивает ли система тематические хабы и сводит ли материалы,
# не превращая пересказ и оригинал в два независимых подтверждения.

- id: B-01
  category: B
  question: "Когда ехать на выставку посетителем-разведчиком, а когда брать стенд?"
  answerable: true
  expected_source_ids:
    - vybor-meropriyatiy--vybor-meropriyatiy
    - istochniki-video--strategies-for-growing-international-sales-through-trade-sho
    - istochniki-video--kak-rabotat-na-mezhdunarodnyh-vystavkah-rusglobaleksport
  must_contain: ["посетител", "стенд"]
  must_not_contain: []
  expected_limitations: ["provider_stance"]
  notes: >
    Хаб «Выбор мероприятий» плюс источники. Сравнение трёх вариантов: делегат с
    назначенными встречами, коллективный павильон, отдельный стенд. Рекомендация «сначала
    приехать посетителем» частично идёт от организатора участия — это должно быть помечено.
  holdout: false



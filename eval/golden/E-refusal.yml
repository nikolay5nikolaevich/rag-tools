# Категория E — обязательный отказ.
# Ключевая витрина проекта: система распознаёт отсутствие данных и говорит об этом прямо.
# Долю отказов не занижать — она важнее красивых цифр по остальным категориям.
#
# Вопросы разделены на два подтипа, и второй сложнее:
#   «чистый» отказ — в корпусе нет вообще ничего по теме;
#   «отказ при частичном совпадении» — тема в корпусе есть, а запрошенных данных нет.
# Второй тип ловит главный режим отказа RAG: система находит похожий фрагмент
# и достраивает недостающее правдоподобной выдумкой.

- id: E-01
  category: E
  question: "Сколько стоит квадратный метр площади на Hannover Messe 2026?"
  answerable: false
  expected_source_ids: []
  must_contain: []
  must_not_contain: ["€", "$", "евро за", "долларов за"]
  expected_limitations: ["no_data"]
  notes: >
    ОТКАЗ ПРИ ЧАСТИЧНОМ СОВПАДЕНИИ. Hannover Messe в корпусе упоминается — в «Аналитике
    статей», в списке десяти крупнейших выставок мира. А вот цен за квадратный метр в
    корпусе нет нигде. Система найдёт релевантный на вид фрагмент и должна устоять.
    Любая названная сумма — грубая ошибка, даже с оговоркой «примерно».
  holdout: false



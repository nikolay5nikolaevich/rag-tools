[project]
name = "ergovault-rag"
version = "0.1.0"
description = "RAG-сервис над исследовательским корпусом ErgoVault"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "anthropic>=0.40",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ev = "ergovault.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ergovault*"]

[tool.setuptools.package-data]
ergovault = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: реальный вызов claude CLI/API, вне обычного прогона (T-15)"]
addopts = "-m 'not live'"

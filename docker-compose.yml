services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ergovault
      POSTGRES_PASSWORD: ergovault
      POSTGRES_DB: ergovault
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergovault -d ergovault"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  db_data:

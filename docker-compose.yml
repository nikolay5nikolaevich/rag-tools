services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ergovault
      POSTGRES_PASSWORD: ergovault
      POSTGRES_DB: ergovault
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergovault -d ergovault"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Заглушка: наполнит T-22 (build backend/, `ev serve`). Не поднимается по умолчанию —
  # только при явном `docker compose --profile full up`.
  api:
    image: python:3.12-slim
    profiles: ["full"]
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      EV_DATABASE_URL: postgresql://ergovault:ergovault@db:5432/ergovault

volumes:
  db_data:
